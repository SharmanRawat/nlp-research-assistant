{% extends "base.html" %}
{% block content %}
<h1>💡 Surprising Insights Detector</h1>
<p class="text-muted">Finds counter‑intuitive or unexpected findings in your paper.</p>

<div class="card shadow">
    <div class="card-body">
        <h5>Current Paper: <span id="paperName">{{ filename or "None" }}</span></h5>
        <button id="loadInsightsBtn" class="btn btn-primary mt-2">🔍 Find Surprising Insights</button>
        <div id="insightResult" class="mt-3"></div>
    </div>
</div>

<script>
async function loadInsights() {
    document.getElementById('insightResult').innerHTML = '<div class="spinner-border"></div> Analyzing...';
    try {
        const response = await fetch('/api/insights', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
        const data = await response.json();
        document.getElementById('insightResult').innerHTML = `
            <div class="alert alert-info" style="border-left: 4px solid #6c63ff;">
                <h4>🤯 Surprising Insight</h4>
                <p>${data.insight}</p>
            </div>
            <button class="btn btn-sm btn-success" onclick="downloadText('${encodeURIComponent(data.insight)}', 'insight.txt')">📥 Download</button>
        `;
    } catch (error) {
        document.getElementById('insightResult').innerHTML = '<div class="alert alert-danger">Failed to load insights.</div>';
    }
}

function downloadText(text, filename) {
    const blob = new Blob([decodeURIComponent(text)], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

document.getElementById('loadInsightsBtn').addEventListener('click', loadInsights);
</script>
{% endblock %}
